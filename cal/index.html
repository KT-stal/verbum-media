<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Verbum · план соцмереж</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<style>
/* Той самий формат, що й графік КТ-Сталь: стрічка днів, вкладки каналів. Акцент — бірюза Verbum, лише для «сьогодні» і дії. */
:root{--bg:#f3f2ee;--card:#fff;--fg:#17170f;--mute:#6b6a5f;--line:#dddbd0;--y:#2fc3c9;--yfg:#0c1415;--ok:#1d7a3e;--no:#b3261e;--chip:#ebe9df;--bar:#1f9aa0;
--font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111110;--card:#1c1c19;--fg:#f2f1ea;--mute:#a09f93;--line:#33332d;--chip:#2a2a25;--bar:#4fd1d6;--ok:#5fd08a;--no:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111110;--card:#1c1c19;--fg:#f2f1ea;--mute:#a09f93;--line:#33332d;--chip:#2a2a25;--bar:#4fd1d6;--ok:#5fd08a;--no:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:500 15px/1.45 var(--font)}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:800 26px/1.15 var(--font);margin:0;text-wrap:balance}
.sub{color:var(--mute);margin:6px 0 0}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);margin-top:8px;padding-block:10px 8px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.bar button{flex:none;font:700 14px var(--font);padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.nav{display:flex;gap:8px;align-items:center}
.nav .today{flex:none;font:800 14px var(--font);padding:9px 16px;border-radius:999px;border:1px solid var(--y);background:var(--y);color:var(--yfg);cursor:pointer}
.nav input{flex:1;min-width:0;max-width:220px;font:700 14px var(--font);padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.share{font:800 14px var(--font);padding:10px 16px;border-radius:10px;border:1px solid var(--y);background:var(--y);color:var(--yfg);cursor:pointer}
.share:disabled{opacity:.6}
.row a{font:700 14px var(--font)}
.cbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cbar button{flex:none;font:800 14px var(--font);padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.cbar button[aria-pressed="true"]{background:var(--y);color:var(--yfg);border-color:var(--y)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--y);outline-offset:2px}
h2{font:800 13px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:26px 0 10px}
.list{display:flex;flex-direction:column;gap:10px}
.day{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start;scroll-margin-top:130px}
.date{text-align:center;padding-top:10px}
.date b{display:block;font:800 24px/1 var(--font);font-variant-numeric:tabular-nums}
.date span{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.day.now .date b{background:var(--y);color:var(--yfg);border-radius:10px;padding:6px 0}
.col{display:grid;gap:12px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:10px}
.empty{color:var(--mute);padding:10px 0;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:700 12px var(--font);padding:3px 9px;border-radius:999px;background:var(--chip)}
.chip.done{color:var(--ok)}.chip.no{color:var(--no)}.chip.fun{background:var(--y);color:var(--yfg)}
.ttl{font:700 17px/1.25 var(--font);margin:0}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -12px;padding:0 12px}
.strip img{flex:none;width:62%;max-width:260px;border-radius:8px;scroll-snap-align:start;background:var(--chip);aspect-ratio:4/5;object-fit:cover}
.reel{position:relative;width:62%;max-width:260px;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#000;border:0;padding:0;cursor:pointer;display:block}
.reel img,.reel video{width:100%;height:100%;object-fit:cover;display:block}
.reel i{position:absolute;inset:0;margin:auto;width:58px;height:58px;border-radius:50%;background:var(--y);display:grid;place-items:center}
.reel i::after{content:"";border-left:18px solid var(--yfg);border-block:11px solid transparent;margin-left:5px}
details{font-size:14px;color:var(--mute)}summary{cursor:pointer;font-weight:700;color:var(--fg)}
details p{white-space:pre-wrap;margin:8px 0 0;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
a{color:inherit}
.brief{display:flex;flex-direction:column;gap:10px}
.plot{font:500 17px/1.5 var(--font);margin:0}
.brief dl{margin:0;display:grid;grid-template-columns:1fr;gap:2px}
.brief dt{font:800 11px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.brief dd{margin:0;font-size:15px}
.meters{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.dots{display:flex;gap:4px}.dots i{flex:1;height:8px;border-radius:4px;background:var(--chip)}.dots i.on{background:var(--y)}
.meters b{font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font:700 14px var(--font);font-variant-numeric:tabular-nums}
.stats b{font-weight:800}.stats .net{color:var(--mute);font-weight:800}
.top{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.top h3{font:800 16px var(--font);margin:0}
.top ol,.top ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.top p{margin:0;font-size:14px;color:var(--mute)}
.fwrap{overflow-x:auto}
.ftab{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.ftab th,.ftab td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.ftab th:first-child{text-align:left}
.ftab tr:first-child th{color:var(--mute);font-weight:600;font-size:12px}
.ntab td,.ntab th{text-align:left;white-space:normal}
.ntab button{font:800 14px var(--font);background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;text-align:left}
.where{display:flex;flex-wrap:wrap;gap:6px;margin:0;font-size:12px;color:var(--mute);align-items:center}
.where .n{padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-weight:700;text-decoration:none}
.where .n.on{color:var(--ok);border-color:currentColor}
.where.off .n{opacity:.7;border-style:dashed}
.chan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:6px;display:flex;flex-direction:column;gap:12px}
.chan h3{font:800 20px var(--font);margin:0;display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.chan h3 a{font:700 13px var(--font);color:var(--mute)}
.chan p{margin:0;font-size:14px;color:var(--mute)}
.facts{display:grid;grid-template-columns:1fr;gap:4px;font-size:14px}
.facts b{font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.kpi b{display:block;font:800 26px/1.1 var(--font);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mute)}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.chart{min-width:0}.chart h4{font:800 13px var(--font);margin:0 0 4px}
.chart svg{display:block;width:100%;height:auto;max-height:190px}
.chart rect{fill:var(--bar)}.chart text{fill:var(--mute);font:600 11px var(--font)}.chart text.v{fill:var(--fg);font-weight:800}.chart line{stroke:var(--line)}
@media (min-width:900px){
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;align-items:start}
.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.facts{grid-template-columns:repeat(2,minmax(0,1fr))}
h1{font-size:32px}}

function topBox(){const t=document.getElementById('top');t.textContent='';if(filter==='work'||(chan!=='all'&&chan!=='instagram')){t.hidden=true;return}t.hidden=false;
 t.append(el('h3','','Що залітає'));const ol=el('ol');(D.top||[]).forEach(([sc,n,r,l])=>{const li=el('li','',n+' — бал '+sc+', охоплення '+r+' ');if(l){const a=el('a','','↗');a.href=l;a.target='_blank';a.rel='noopener';li.append(a)}ol.append(li)});t.append(ol);
 t.append(el('p','','Бал = (вподобання + 2×коментарі + 3×збереження + 3×поширення) / охоплення × 100. Поки охоплення 3–40 людей, бали випадкові: кандидата на рекламу визначаємо тестом із малим бюджетом. Статистика на '+D.at+'.'));
 if((D.concl||[]).length){t.append(el('h3','','Висновки'));const u=el('ul');D.concl.forEach(s=>u.append(el('li','',s)));t.append(u)}
 if((D.audit||[]).length){t.append(el('h3','','Аудит каналів і що робимо'));const u=el('ul');D.audit.forEach(s=>u.append(el('li','',s)));t.append(u)}}
function card(x){const c=el('div','card'),ch=el('div','chips');
 ch.append(el('span','chip'+(x.cart?' fun':''),x.cart?'Мультик':TYPE[x.t]));
 if(x.st==='done')ch.append(el('span','chip done','Опубліковано'));else if(x.st==='error')ch.append(el('span','chip no','Помилка публікації'));else ch.append(el('span','chip',x.d<today?'Не вийшов':'У черзі · '+x.h));
 c.append(ch,el('p','ttl',x.n));
 const G={out:[],will:[],no:[]};x.nets.forEach(k=>{const v=placed(k,x);if(v)G.out.push([k,v]);else if(isPast(x))G.no.push([k,x.st==='done'&&k!=='linkedin'?'ще не продубльовано':'не вийшло']);else G.will.push([k,''])});
 [['out','Вийшло:'],['will','Вийде о '+x.h+':'],['no','Не вийшло:']].forEach(([g,lab])=>{if(!G[g].length)return;const wr=el('p','where'+(g==='no'?' off':''));wr.append(lab);G[g].forEach(([k,v])=>{let n;if(g==='out'&&/^https:\/\//.test(v)){n=el('a','n on',NETS[k].n+' ✓');n.href=v;n.target='_blank';n.rel='noopener'}else n=el('span','n'+(g==='out'?' on':''),NETS[k].n+(g==='out'?' ✓':'')+(g==='no'&&v?' · '+v:''));wr.append(n)});c.append(wr)});
 statRow(x).forEach(r=>c.append(r));
 if(x.v)c.append(reel(x.v,x.p));else if(x.im&&x.im.length){const s=el('div','strip');x.im.forEach((u,k)=>{const im=el('img');im.src=u;im.loading='lazy';im.alt='Слайд '+(k+1)+' з '+x.im.length;s.append(im)});c.append(s)}
 const r=el('div','row'),sb=el('button','share','Поділитися');sb.type='button';sb.onclick=()=>share(x,sb);r.append(sb);
 if(x.pl&&x.pl.instagram){const a=el('a','','Відкрити в Instagram ↗');a.href=x.pl.instagram;a.target='_blank';a.rel='noopener';r.append(a)}c.append(r);
 const br=brief(x.b);if(br)c.append(br);
 if(x.c){const dt=el('details');dt.append(el('summary','','Підпис під дописом'),el('p','',x.c));c.append(dt)}

 return c}
function render(){const root=document.getElementById('root');root.textContent='';chanPanel();topBox();
 if(filter==='work'){root.append(el('h2','','Мультики у виробництві'));const l=el('div','list');if(!D.dr.length)l.append(el('p','empty','Зараз нічого.'));D.dr.forEach(x=>{const c=el('div','card'),ch=el('div','chips');ch.append(el('span','chip fun','Мультик'),el('span','chip','У виробництві'+(x.d?' · на '+x.d.slice(8)+'.'+x.d.slice(5,7):'')));c.append(ch,el('p','ttl',x.n));const br=brief(x.b);if(br)c.append(br);else if(x.c)c.append(el('p','',x.c));l.append(c)});root.append(l);return}
 const ok=x=>filter==='all'||(filter==='reel'?x.t==='reel'&&!x.cart:filter==='cart'?x.cart:x.t!=='reel');
 const items=D.q.filter(x=>ok(x)&&(chan==='all'||x.nets.includes(chan)));if(!items.length){root.append(el('p','empty','У цьому каналі ще немає дописів за вибраним фільтром.'));return}
 const by={};items.forEach(x=>(by[x.d]=by[x.d]||[]).push(x));let days=Object.keys(by).sort();
 if(filter==='all'&&chan==='all'){const from=new Date(Date.parse(today+'T12:00Z')-7*864e5).toISOString().slice(0,10),last=days[days.length-1],set=new Set(days);for(let t=new Date(from+'T12:00Z');t.toISOString().slice(0,10)<=last;t=new Date(+t+864e5))set.add(t.toISOString().slice(0,10));days=[...set].sort()}
 let m='',l;days.forEach(k=>{if(k.slice(0,7)!==m){m=k.slice(0,7);root.append(el('h2','',MN[+k.slice(5,7)-1]+' '+k.slice(0,4)));l=el('div','list');root.append(l)}
  const dd=new Date(k+'T12:00Z'),row=el('div','day'+(k===today?' now':''));row.id='d-'+k;const dt=el('div','date');dt.append(el('b','',String(+k.slice(8))),el('span','',WD[dd.getUTCDay()]));row.append(dt);
  if(by[k]){if(by[k].length>1){const col=el('div','col');by[k].forEach(x=>col.append(card(x)));row.append(col)}else row.append(card(by[k][0]))}else row.append(el('div','empty','Без допису'));l.append(row)})}
const ahead=D.q.filter(x=>x.st!=='done'&&x.d>=today),lastd=ahead.length?ahead[ahead.length-1].d:'';
document.getElementById('sub').textContent='Усі канали Verbum на одній сторінці. Обери канал угорі — побачиш, що там уже вийшло, що в черзі та які цифри. Попереду '+ahead.length+' дописів'+(lastd?', розписано до '+lastd.slice(8)+'.'+lastd.slice(5,7)+'.'+lastd.slice(0,4):'')+'. Час київський. Оновлено '+D.built+'.';
const cbar=document.getElementById('cbar');[['all','Усі канали']].concat(Object.keys(NETS).map(k=>[k,NETS[k].n])).forEach(([k,t])=>{const b=el('button','',t);b.type='button';b.dataset.k=k;b.setAttribute('aria-pressed',k===chan);b.onclick=()=>setChan(k);cbar.append(b)});
const bar=document.getElementById('bar');
[['all','Усе'],['reel','Ролики'],['cart','Мультики'],['car','Каруселі'],['work','У виробництві']].forEach(([k,t])=>{const b=el('button','',t);b.type='button';b.id='f-'+k;b.setAttribute('aria-pressed',k===filter);b.onclick=()=>{filter=k;bar.querySelectorAll('button[aria-pressed]').forEach(o=>o.setAttribute('aria-pressed',o===b));render();if(k==='work')window.scrollTo(0,0);else jump(today,false)};bar.append(b)});
const FILES={};
function shareUrl(x){return (x.pl&&(x.pl.instagram||x.pl.linkedin))||x.v||(x.im&&x.im[0])||location.href.split('#')[0]+'#d-'+x.d}
async function shareLink(x,b){const url=shareUrl(x);if(navigator.share){try{await navigator.share({title:x.n,text:x.n,url})}catch(e){}return}
 try{await navigator.clipboard.writeText(url);b.textContent='Посилання скопійовано';setTimeout(()=>b.textContent='Поділитися',2500)}catch(e){window.prompt('Скопіюйте посилання',url)}}
async function share(x,b){
 // ролик ділимося самим файлом (стандартне меню телефона: Telegram, Viber, WhatsApp, Instagram…); якщо не вийде — посиланням
 if(!x.v||!navigator.share||!navigator.canShare)return shareLink(x,b);
 const f=FILES[x.s];
 if(f){try{await navigator.share({files:[f],title:x.n});b.textContent='Поділитися'}catch(e){if(e.name!=='AbortError')shareLink(x,b)}return}
 b.disabled=true;b.textContent='Готую ролик…';
 try{const bl=await (await fetch(x.v)).blob(),file=new File([bl],x.s+'.mp4',{type:'video/mp4'});
  if(!navigator.canShare({files:[file]})){b.disabled=false;b.textContent='Поділитися';return shareLink(x,b)}
  FILES[x.s]=file;b.disabled=false;
  try{await navigator.share({files:[file],title:x.n});b.textContent='Поділитися'}catch(e){b.textContent=e.name==='AbortError'?'Поділитися':'Ролик готовий — натисніть ще раз'}}
 catch(e){b.disabled=false;b.textContent='Поділитися';shareLink(x,b)}}
function jump(day,smooth){const ds=[...document.querySelectorAll('.day')];if(!ds.length)return;let t=ds.find(e=>e.id.slice(2)>=day)||ds[ds.length-1];
 const y=t.getBoundingClientRect().top+window.scrollY-document.getElementById('sticky').offsetHeight-8;window.scrollTo({top:Math.max(0,y),behavior:smooth?'smooth':'auto'});pick.value=t.id.slice(2)}
const pick=document.getElementById('pick');pick.value=today;if(D.q.length){pick.min=D.q[0].d;pick.max=D.q[D.q.length-1].d}
pick.onchange=()=>{if(pick.value)jump(pick.value,true)};
document.getElementById('today').onclick=()=>jump(today,true);
render();
requestAnimationFrame(()=>jump(location.hash.startsWith('#d-')?location.hash.slice(3):today,false));
